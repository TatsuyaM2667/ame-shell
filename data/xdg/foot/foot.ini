# ame-shell の foot の既定設定(ame-session が XDG_CONFIG_DIRS の先頭に置く)。
# 自分の ~/.config/foot/foot.ini があればそちらが優先されます。
# 半透明の夜空色の背景(壁紙が透けて見える)と、ame-shell の配色に合わせたパレット。

[main]
font=JetBrains Mono:size=12, monospace:size=12, Noto Sans Mono CJK JP:size=12, Symbols Nerd Font:size=12
pad=24x24
dpi-aware=no
# 開いたときに fastfetch を出してから、いつものシェルに(AME_FASTFETCH=0 で出さない)
shell=ame-term-shell

[cursor]
style=beam
blink=yes

[colors-dark]
alpha=0.65
background=060913
foreground=cdd6f4
selection-foreground=060913
selection-background=89b4fa
regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=7fdceb
regular7=bac2de
bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=a6adc8
