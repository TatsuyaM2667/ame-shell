# ame-shell のセッション(XDG_CURRENT_DESKTOP=river)で使うポータルの実装。
# ame-session が XDG_CONFIG_DIRS の先頭にこのディレクトリを置く。
# 自分の ~/.config/xdg-desktop-portal/river-portals.conf があればそちらが優先される。
#
# 既定(ファイルを開く・保存する画面など)は GTK の実装、画面の撮影と画面共有は wlroots の実装
# (xdg-desktop-portal-gtk / xdg-desktop-portal-wlr)。
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
